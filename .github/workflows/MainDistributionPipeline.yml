name: Main Extension Distribution Pipeline

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/master' || github.sha }}
  cancel-in-progress: true

jobs:
  macos-arm64-smoke:
    name: macOS arm64 build + test (no artifact upload)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ninja
        run: brew install ninja

      - name: Configure
        shell: bash
        run: make configure

      - name: Build
        shell: bash
        run: make release

      - name: SQLLogicTest
        shell: bash
        run: make test_release

      - name: Runtime smoke test
        shell: bash
        run: make smoke-test

  windows-amd64-smoke:
    name: Windows amd64 build + test (no artifact upload)
    runs-on: windows-latest
    env:
      PYO3_PYTHON: python
      PYTHON_BIN: python
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: dtolnay/rust-toolchain@stable

      - name: Install build tools
        shell: powershell
        run: choco install make ninja jq -y

      - name: Configure
        shell: bash
        run: make configure

      - name: Build
        shell: bash
        run: make release

      - name: SQLLogicTest
        shell: bash
        run: make test_release

      - name: Runtime smoke test
        shell: bash
        run: make smoke-test
