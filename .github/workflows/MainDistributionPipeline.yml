name: Main Extension Distribution Pipeline

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/master' || github.sha }}
  cancel-in-progress: true

jobs:
# ── Smoke tests ──────────────────────────────────────────────────────────
  macos-arm64-smoke:
    name: macOS arm64 smoke
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Ninja
        run: brew install ninja
      - name: Configure
        run: make configure
      - name: Build
        run: make release
      - name: SQLLogicTest
        run: make test_release
      - name: Runtime smoke test
        run: make smoke-test

  windows-amd64-smoke:
    name: Windows amd64 smoke
    runs-on: windows-latest
    env:
      PYO3_PYTHON: python
      PYTHON_BIN: python
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build tools
        shell: powershell
        run: choco install make ninja jq -y
      - name: Configure
        shell: bash
        run: make configure
      - name: Build
        shell: bash
        run: make release
      - name: Runtime smoke test
        shell: bash
        run: make smoke-test

  linux-amd64-smoke:
    name: Linux amd64 smoke
    runs-on: ubuntu-24.04
    env:
      PYO3_PYTHON: /usr/bin/python3.12
      PYTHON_BIN: /usr/bin/python3.12
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build tools and Python dev headers
        run: |
          sudo apt-get update -y -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq make ninja-build jq python3.12-dev python3.12-venv
      - name: Configure
        run: make configure
      - name: Build
        run: make release
      - name: SQLLogicTest
        run: make test_release
      - name: Runtime smoke test
        run: make smoke-test

  duckdb-stable-build:
    name: Distribution
    needs: [linux-amd64-smoke, macos-arm64-smoke]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5-variegata
    with:
      duckdb_version: v1.5.4
      ci_tools_version: v1.5-variegata
      extension_name: python_udf
      extra_toolchains: rust;python3
      exclude_archs: 'linux_arm64;linux_amd64_musl;wasm_mvp;wasm_eh;wasm_threads;windows_amd64;windows_amd64_mingw;windows_amd64_rtools'
      skip_tests: true
    secrets: inherit

  release:
    name: Create GitHub Release
    needs: duckdb-stable-build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Rename release assets with platform suffix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          shopt -s nullglob
          for artifact_dir in artifacts/*; do
            [ -d "$artifact_dir" ] || continue
            artifact_name=$(basename "$artifact_dir")
            platform_suffix="${artifact_name##*-extension-}"
            for asset in "$artifact_dir"/*.duckdb_extension "$artifact_dir"/*.duckdb_extension.wasm; do
              [ -f "$asset" ] || continue
              asset_name=$(basename "$asset")
              if [[ "$asset_name" == *.duckdb_extension.wasm ]]; then
                extension_suffix=".duckdb_extension.wasm"
                stem="${asset_name%.duckdb_extension.wasm}"
              else
                extension_suffix=".duckdb_extension"
                stem="${asset_name%.duckdb_extension}"
              fi
              cp "$asset" "release-assets/${stem}-${platform_suffix}${extension_suffix}"
            done
          done
          test -n "$(find release-assets -type f | head -1)"
          find release-assets -type f | sort

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
