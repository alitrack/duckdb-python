name: Main Extension Distribution Pipeline

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/master' || github.sha }}
  cancel-in-progress: true

jobs:
# ── Quick smoke tests (no Docker, no artifact) ────────────────────────────
  macos-arm64-smoke:
    name: macOS arm64 smoke
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Ninja
        run: brew install ninja
      - name: Configure
        shell: bash
        run: make configure
      - name: Build
        shell: bash
        run: make release
      - name: SQLLogicTest
        shell: bash
        run: make test_release
      - name: Runtime smoke test
        shell: bash
        run: make smoke-test

  windows-amd64-smoke:
    name: Windows amd64 smoke
    runs-on: windows-latest
    env:
      PYO3_PYTHON: python
      PYTHON_BIN: python
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build tools
        shell: powershell
        run: choco install make ninja jq -y
      - name: Configure
        shell: bash
        run: make configure
      - name: Build
        shell: bash
        run: make release
      - name: Runtime smoke test
        shell: bash
        run: make smoke-test

  linux-amd64-smoke:
    name: Linux amd64 smoke
    runs-on: ubuntu-24.04
    env:
      PYO3_PYTHON: /usr/bin/python3.12
      PYTHON_BIN: /usr/bin/python3.12
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build tools and Python dev headers
        shell: bash
        run: |
          sudo apt-get update -y -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq make ninja-build jq python3.12-dev python3.12-venv
      - name: Configure
        shell: bash
        run: make configure
      - name: Build
        shell: bash
        run: make release
      - name: SQLLogicTest
        shell: bash
        run: make test_release
      - name: Runtime smoke test
        shell: bash
        run: make smoke-test

# ── Formal distribution (Docker-based, uploads .duckdb_extension) ──────────
  duckdb-stable-build:
    name: Distribution
    needs: [macos-arm64-smoke, linux-amd64-smoke]
    # Only on master pushes to conserve artifact storage
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5-variegata
    with:
      duckdb_version: v1.5.4
      ci_tools_version: v1.5-variegata
      extension_name: pyudf
      extra_toolchains: rust;python3
      exclude_archs: 'linux_arm64;wasm_mvp;wasm_eh;wasm_threads;windows_amd64'
    secrets: inherit